name: Corriger commit-full-screen

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-commit-full-screen.yml"

permissions:
  contents: write

jobs:
  fix_image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer la révision exacte
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/skills/introduction-to-github/d7f8a7812e111e1a38fa2f60480a9c7228ccc852/images/commit-full-screen.png" \
            --output images/commit-full-screen.png
          test "$(xxd -p -l 8 images/commit-full-screen.png)" = "89504e470d0a1a0a"

      - name: Committer la révision exacte
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/commit-full-screen.png
          git diff --cached --quiet && exit 0
          git commit -m "Aligner commit-full-screen sur la version historique"
          git push
